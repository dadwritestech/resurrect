<!doctype html><meta charset="utf-8"><title>dead</title>
<style>
body{margin:0;background:#1e1e1e;color:#ddd;font:20px/1.6 Consolas,Menlo,monospace;display:flex;align-items:center;justify-content:center;height:100vh}
pre{margin:0;padding:32px 40px;background:#111;border-radius:10px;box-shadow:0 10px 40px #0008;white-space:pre-wrap;max-width:880px}
.p{color:#6c6}.e{color:#f77}.c{color:#888}
</style>
<pre id="t"></pre>
<script>
// text comes from the URL hash: real terminal output captured with curl on 2026-10-28
var lines = decodeURIComponent(location.hash.slice(1)).split('\n');
document.getElementById('t').innerHTML = lines.map(function (l) {
  var s = l.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  if (s.indexOf('$ ') === 0) return '<span class="p">$</span> ' + s.slice(2);
  if (s.indexOf('# ') === 0) return '<span class="c">' + s + '</span>';
  return '<span class="e">' + s + '</span>';
}).join('\n');
</script>
